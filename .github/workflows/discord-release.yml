name: Discord Release Notify

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Release Message
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          TAG_NAME: ${{ github.event.release.tag_name || 'v2.2.0' }}
          RELEASE_TITLE: ${{ github.event.release.name || '' }}
          RELEASE_URL: ${{ github.event.release.html_url || 'https://github.com/abeloskyyy/HelloWorld-Launcher/releases' }}
          EVENT_BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK secret is empty or not configured in GitHub Secrets!"
            exit 1
          fi

          # Title fallback
          TITLE="$RELEASE_TITLE"
          if [ -z "$TITLE" ]; then
            TITLE="$TAG_NAME"
          fi

          # Body fallback: If triggered manually or release body is empty, fetch from Gist changelog
          BODY="$EVENT_BODY"
          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            echo "Fetching release notes from Gist..."
            BODY=$(curl -s "https://gist.githubusercontent.com/abeloskyyy/b50089b634ed09f48c921f9c8126a49f/raw/hwlauncher-info.json" | jq -r '.changelog.versions[0].markdown // empty')
          fi
          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            BODY="No release notes provided."
          fi

          # Truncate changelog body if longer than 1800 chars to avoid Discord 400 Bad Request error
          TRUNCATED="false"
          if [ ${#BODY} -gt 1800 ]; then
            BODY="$(echo "$BODY" | cut -c 1-1800)"
            TRUNCATED="true"
          fi

          # Create robust JSON payload with jq and real JSON newlines
          PAYLOAD=$(jq -n \
            --arg title "🚀 New Release: $TITLE" \
            --arg version "$TAG_NAME" \
            --arg body "$BODY" \
            --arg url "$RELEASE_URL" \
            --arg truncated "$TRUNCATED" \
            '{
              embeds: [
                {
                  title: $title,
                  description: (
                    "**Version:** " + $version + "\n\n" + $body +
                    (if $truncated == "true" then "\n\n... [Read full release notes on GitHub](" + $url + ")" else "" end)
                  ),
                  url: $url,
                  color: 1096065,
                  footer: {
                    text: "HelloWorld Launcher • Official Release"
                  },
                  timestamp: (now | todate)
                }
              ]
            }')

          echo "Sending notification to Discord..."
          RESPONSE=$(curl -s -S -w "\n%{http_code}" -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK_URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          CONTENT=$(echo "$RESPONSE" | sed '$d')

          echo "Discord Response Code: $HTTP_CODE"
          if [ -n "$CONTENT" ]; then
            echo "Discord Response Body: $CONTENT"
          fi

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Message successfully sent to Discord!"
          else
            echo "::error::Failed to send Discord webhook. HTTP Status: $HTTP_CODE"
            exit 1
          fi
