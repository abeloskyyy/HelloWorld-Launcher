name: Discord Release Notify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to notify (e.g. v2.2.0). Leave empty to auto-detect latest release.'
        required: false
        type: string
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Release Message
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TITLE: ${{ github.event.release.name || '' }}
          EVENT_RELEASE_URL: ${{ github.event.release.html_url || '' }}
          EVENT_BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK secret is empty or not configured in GitHub Secrets!"
            exit 1
          fi

          # Tag resolution
          TAG_NAME="$INPUT_TAG"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="$EVENT_TAG"
          fi
          if [ -z "$TAG_NAME" ]; then
            echo "Attempting to fetch latest release tag from GitHub API..."
            TAG_NAME=$(curl -s "https://api.github.com/repos/abeloskyyy/HelloWorld-Launcher/releases/latest" | jq -r '.tag_name // empty')
          fi
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v2.2.0"
          fi

          # Release URL resolution
          RELEASE_URL="$EVENT_RELEASE_URL"
          if [ -z "$RELEASE_URL" ]; then
            RELEASE_URL="https://github.com/abeloskyyy/HelloWorld-Launcher/releases/tag/$TAG_NAME"
          fi

          # Title fallback
          TITLE="$RELEASE_TITLE"
          if [ -z "$TITLE" ]; then
            TITLE="HelloWorld Launcher $TAG_NAME"
          fi

          # Body fallback: If triggered manually or release body is empty, fetch from Gist changelog
          BODY="$EVENT_BODY"
          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            echo "Fetching release notes from Gist..."
            BODY=$(curl -s "https://gist.githubusercontent.com/abeloskyyy/b50089b634ed09f48c921f9c8126a49f/raw/hwlauncher-info.json" | jq -r '.changelog.versions[0].markdown // empty')
          fi
          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            BODY="No release notes provided."
          fi

          # Truncate changelog body if longer than 1800 chars to avoid Discord 400 Bad Request error
          TRUNCATED="false"
          if [ ${#BODY} -gt 1800 ]; then
            BODY="$(echo "$BODY" | cut -c 1-1800)"
            TRUNCATED="true"
          fi

          # Create robust JSON payload with jq including Link Button components
          PAYLOAD=$(jq -n \
            --arg title "🚀 New Release: $TITLE" \
            --arg version "$TAG_NAME" \
            --arg body "$BODY" \
            --arg url "$RELEASE_URL" \
            --arg truncated "$TRUNCATED" \
            --arg download_url "https://hwlauncher.abelosky.com" \
            '{
              embeds: [
                {
                  title: $title,
                  description: (
                    "**Version:** " + $version + "\n\n" + $body +
                    (if $truncated == "true" then "\n\n... [Read full release notes on GitHub](" + $url + ")" else "" end)
                  ),
                  url: $url,
                  color: 1096065,
                  footer: {
                    text: "HelloWorld Launcher • Official Release"
                  },
                  timestamp: (now | todate)
                }
              ],
              components: [
                {
                  type: 1,
                  components: [
                    {
                      type: 2,
                      style: 5,
                      label: "Descargar Ahora",
                      url: $download_url,
                      emoji: {
                        name: "🚀"
                      }
                    },
                    {
                      type: 2,
                      style: 5,
                      label: "Ver en GitHub",
                      url: $url,
                      emoji: {
                        name: "📦"
                      }
                    }
                  ]
                }
              ]
            }')

          echo "Sending notification to Discord..."
          RESPONSE=$(curl -s -S -w "\n%{http_code}" -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK_URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          CONTENT=$(echo "$RESPONSE" | sed '$d')

          echo "Discord Response Code: $HTTP_CODE"
          if [ -n "$CONTENT" ]; then
            echo "Discord Response Body: $CONTENT"
          fi

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Message successfully sent to Discord!"
          else
            echo "::error::Failed to send Discord webhook. HTTP Status: $HTTP_CODE"
            exit 1
          fi
