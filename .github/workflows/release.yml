name: Publish Official Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.2.0). Leave empty to use version from package.json'
        required: false
        type: string
        default: ''
      build_run_id:
        description: 'Run ID of "Build Application". Leave empty to use latest successful build'
        required: false
        type: string
        default: ''
      is_draft:
        description: 'Publish as Draft release?'
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: 'Publish as Pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  publish-release:
    name: Publish Official Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve Release Tag & Build Run ID
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          INPUT_RUN_ID: ${{ github.event.inputs.build_run_id }}
        run: |
          # 1. Resolver Tag
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            APP_VERSION=$(node -p "require('./package.json').version")
            TAG="v$APP_VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release Tag: $TAG"

          # 2. Resolver Build Run ID
          if [ -n "$INPUT_RUN_ID" ]; then
            RUN_ID="$INPUT_RUN_ID"
            echo "Using specified Build Run ID: $RUN_ID"
          else
            echo "Looking for latest successful 'Build Application' workflow run..."
            RUN_ID=$(gh run list --workflow="build.yml" --status="success" --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "::error::Could not find any successful run of build.yml. Please run 'Build Application' first or provide build_run_id."
              exit 1
            fi
            echo "Found latest successful Build Run ID: $RUN_ID"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Build Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          mkdir -p raw-artifacts
          echo "Downloading artifacts from run $BUILD_RUN_ID..."
          gh run download "$BUILD_RUN_ID" --dir raw-artifacts

          mkdir -p release-assets
          find raw-artifacts -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.deb" -o -name "*.dmg" \) ! -name "*blockmap*" -exec cp {} release-assets/ \;

          # Asegurar que el instalador Setup.exe esté presente (heredando de la release anterior si hiciera falta para SmartScreen)
          if [ ! -f "release-assets/HelloWorld-Launcher-Setup.exe" ]; then
            echo "HelloWorld-Launcher-Setup.exe not found in build artifacts. Pulling from previous release to retain SmartScreen reputation..."
            mkdir -p prev-setup
            if gh release download --pattern "HelloWorld-Launcher-Setup.exe" --dir prev-setup 2>/dev/null; then
              if [ -f "prev-setup/HelloWorld-Launcher-Setup.exe" ]; then
                cp prev-setup/HelloWorld-Launcher-Setup.exe release-assets/HelloWorld-Launcher-Setup.exe
                echo "Successfully copied HelloWorld-Launcher-Setup.exe from previous release."
              fi
            fi
          fi

          echo "Staged release assets:"
          ls -lh release-assets

          COUNT=$(find release-assets -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No binary installer assets found in run $BUILD_RUN_ID."
            exit 1
          fi

      - name: Generate electron-updater metadata (latest.yml for backwards compatibility)
        env:
          TAG: ${{ steps.resolve.outputs.tag_name || steps.resolve.outputs.tag }}
        run: |
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const path = require("path");

            const version = process.env.TAG.replace(/^v/, "");
            const date = new Date().toISOString();

            function makeYml(fileName, ymlName) {
              const fullPath = path.join("release-assets", fileName);
              if (!fs.existsSync(fullPath)) return;
              const buffer = fs.readFileSync(fullPath);
              const sha512 = crypto.createHash("sha512").update(buffer).digest("base64");
              const size = fs.statSync(fullPath).size;
              const yml = `version: ${version}\nfiles:\n  - url: ${fileName}\n    sha512: ${sha512}\n    size: ${size}\npath: ${fileName}\nsha512: ${sha512}\nreleaseDate: \x27${date}\x27\n`;
              fs.writeFileSync(path.join("release-assets", ymlName), yml);
              console.log(`✅ Generated ${ymlName} for ${fileName} (${size} bytes)`);
            }

            makeYml("HelloWorld-Launcher-Setup.exe", "latest.yml");
            makeYml("helloworld-launcher-linux-amd64.deb", "latest-linux.yml");
            makeYml("helloworld-launcher-linux-arm64.deb", "latest-linux-arm64.yml");
          '
          echo "Release assets including generated metadata:"
          ls -lh release-assets

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag_name || steps.resolve.outputs.tag }}
          IS_DRAFT: ${{ github.event.inputs.is_draft }}
          IS_PRERELEASE: ${{ github.event.inputs.is_prerelease }}
        run: |
          TITLE="HelloWorld Launcher $TAG"
          
          # Verificar archivo de notas
          NOTES_ARG=""
          if [ -f "RELEASE_NOTES.md" ]; then
            echo "Using RELEASE_NOTES.md for release body."
            NOTES_ARG="--notes-file RELEASE_NOTES.md"
          else
            echo "RELEASE_NOTES.md not found. Using auto-generated release notes."
            NOTES_ARG="--generate-notes"
          fi

          DRAFT_FLAG=""
          if [ "$IS_DRAFT" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi

          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Comprobar si la release ya existe
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading/clobbering assets..."
            gh release upload "$TAG" release-assets/* --clobber
            if [ -f "RELEASE_NOTES.md" ]; then
              gh release edit "$TAG" --notes-file RELEASE_NOTES.md
            fi
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release-assets/* \
              --title "$TITLE" \
              $NOTES_ARG \
              $DRAFT_FLAG \
              $PRERELEASE_FLAG
          fi

          echo "Release operation completed successfully for $TAG."

      - name: Trigger Discord Release Notification
        if: ${{ github.event.inputs.is_draft != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ steps.resolve.outputs.tag_name || steps.resolve.outputs.tag }}
        run: |
          if [ -n "$RELEASE_PAT" ]; then
            echo "RELEASE_PAT was used; discord-release.yml will trigger automatically via GitHub release publication."
          else
            echo "Dispatching Discord release notification for $TAG..."
            gh workflow run discord-release.yml -f tag_name="$TAG" || echo "Notice: Could not dispatch discord-release.yml automatically via gh CLI."
          fi
