name: Rebuild Setup Bootstrapper (Windows Only)

on:
  workflow_dispatch:
    inputs:
      target_release_tag:
        description: 'Optional: Release Tag to replace Setup.exe in (e.g. v2.2.0). Leave empty to only generate artifact'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  rebuild-setup:
    name: Build Setup Bootstrapper
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (Root)
        run: npm ci || npm install

      - name: Install dependencies (Installer)
        run: |
          cd installer
          npm ci || npm install
          cd ..

      - name: Build Setup Installer EXE
        run: |
          cd installer
          npm run build:win
          cd ..

      - name: Stage Setup Executable
        shell: bash
        run: |
          mkdir -p dist-setup
          if [ -f "dist/setup/HelloWorld-Launcher-Setup.exe" ]; then
            cp dist/setup/HelloWorld-Launcher-Setup.exe dist-setup/
          else
            echo "::error::HelloWorld-Launcher-Setup.exe was not generated."
            exit 1
          fi
          ls -lh dist-setup

      - name: Upload Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-artifact
          path: dist-setup/*
          retention-days: 30

      - name: Update Setup in GitHub Release (If specified)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.target_release_tag }}
        run: |
          if [ -n "$TAG" ]; then
            echo "Target release specified: $TAG"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Overwriting HelloWorld-Launcher-Setup.exe in release $TAG..."
              gh release upload "$TAG" dist-setup/HelloWorld-Launcher-Setup.exe --clobber
              echo "✅ Successfully updated HelloWorld-Launcher-Setup.exe in release $TAG."
            else
              echo "::warning::Release $TAG does not exist. Setup artifact has been uploaded to Action Run."
            fi
          else
            echo "No target release tag provided. Setup artifact is saved in the Action Run."
          fi
